/* ─── MAIN APP (WITH REAL MCP VERTICAL SLICE) ────── */
function App() {
  const [tab, setTab]           = useState('checkin');
  const [view, setView]         = useState('onboarding');
  const [profile, setProfile]   = useState({ beliefLevel:'some', mindStyle:'balanced', spiritualStrength:'some' });
  const [scores, setScores]     = useState({ sattva:0, rajas:0, tamas:0 });
  const [currentQ, setCurrentQ] = useState(0);
  const [bioData, setBioData]   = useState(null);
  const [sessionId, setSessionId] = useState(null);
  const [showGlobalSupport, setShowGlobalSupport] = useState(false);
  const [librarySession, setLibrarySession] = useState(null);

  // MCP State
  const [mcpStatus, setMcpStatus] = useState('offline'); // offline | connecting | connected | error
  const [mcpPractices, setMcpPractices] = useState(null);
  const [mcpLogs, setMcpLogs] = useState([]);
  const [agentConsentToken, setAgentConsentToken] = useState(() => {
    return localStore.get(STORAGE_KEYS.AGENT_CONSENT, null);
  });

  const mcpClientRef = useRef(new BrowserMcpClient());

  const addMcpLog = (method, tool, status, latencyMs, isError = false) => {
    const entry = {
      id: Date.now() + Math.random().toString(36).slice(2, 6),
      time: new Date().toLocaleTimeString(),
      method,
      tool,
      status,
      latencyMs: latencyMs || 0,
      isError
    };
    setMcpLogs(prev => [...prev.slice(-30), entry]);
  };

  // Real MCP Connection and Tool Discovery Vertical Slice
  const connectToMcpServer = useCallback(async () => {
    setMcpStatus('connecting');
    const client = mcpClientRef.current;
    try {
      // 1. Handshake & initialize
      const initRes = await client.connect();
      addMcpLog('initialize', null, '200 OK', initRes.latencyMs);

      // 2. Discover tools
      const toolsRes = await client.listTools();
      addMcpLog('tools/list', null, `200 (${toolsRes.data.result.tools.length} tools)`, toolsRes.latencyMs);

      // 3. Call list_guided_practices
      const practicesRes = await client.callTool('list_guided_practices', { guna_filter: 'all' });
      addMcpLog('tools/call', 'list_guided_practices', '200 OK', practicesRes.latencyMs);

      const parsed = JSON.parse(practicesRes.data.result.content[0].text);
      if (parsed.practices && Array.isArray(parsed.practices)) {
        setMcpPractices(parsed.practices);
        setMcpStatus('connected');
      }
    } catch (err) {
      console.warn('MCP Server connection failed, falling back to local canonical matrix:', err);
      addMcpLog('connect', null, 'Offline Fallback', 0, true);
      setMcpStatus('offline');
      setMcpPractices(null); // Triggers graceful local fallback
    }
  }, []);

  // Attempt initial background connection on load
  useEffect(() => {
    connectToMcpServer();
  }, [connectToMcpServer]);

  // Handle ambient simulation via real MCP or fallback
  const handleTriggerAmbient = async (actionType, setting) => {
    if (mcpStatus === 'connected') {
      try {
        const res = await mcpClientRef.current.callTool('simulate_ambient_action', { action_type: actionType, setting });
        addMcpLog('tools/call', 'simulate_ambient_action', '200 OK', res.latencyMs);
        return JSON.parse(res.data.result.content[0].text);
      } catch (err) {
        addMcpLog('tools/call', 'simulate_ambient_action', 'Error', 0, true);
      }
    }
    // Honest offline simulation fallback
    return {
      status: 'SIMULATED_SUCCESS',
      simulation_label: '[SIMULATION - LOCAL CLIENT FALLBACK]',
      action_executed: actionType,
      details: { effect: `Simulated action "${actionType}" with parameter "${setting}".` },
      honesty_disclosure: 'Executed inside software simulation only. No physical Echo or IoT hardware was contacted.'
    };
  };

  // Handle agent consent toggle
  const handleToggleAgentConsent = async (granted, currentPrefs) => {
    if (granted) {
      const token = 'agent_token_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      localStore.set(STORAGE_KEYS.AGENT_CONSENT, token);
      setAgentConsentToken(token);
      try {
        await fetch('http://127.0.0.1:3333/mcp/consent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'grant', token, preferences: currentPrefs })
        });
      } catch (e) {
        // Safe offline handling
      }
    } else {
      const prevToken = agentConsentToken;
      localStore.remove(STORAGE_KEYS.AGENT_CONSENT);
      setAgentConsentToken(null);
      if (prevToken) {
        try {
          await fetch('http://127.0.0.1:3333/mcp/consent', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'revoke', token: prevToken })
          });
        } catch (e) {}
      }
    }
  };

  // Test agent preference tool call
  const handleTestAgentAccess = async () => {
    if (mcpStatus === 'connected') {
      try {
        const tokenToTest = agentConsentToken || 'unauthorized_token_test';
        const res = await mcpClientRef.current.callTool('get_consented_preferences', { session_auth_token: tokenToTest });
        addMcpLog('tools/call', 'get_consented_preferences', res.data?.result?.isError ? '403 Denied' : '200 Allowed', res.latencyMs);
        return JSON.parse(res.data.result.content[0].text);
      } catch (err) {
        return { error: err.message };
      }
    }
    return { error: 'MCP server is offline. Start server with "npm run mcp:server" to test.' };
  };

  // Load preferences from local storage
  const [preferences, setPreferences] = useState(() => {
    return localStore.get(STORAGE_KEYS.PREFERENCES, DEFAULT_PREFERENCES);
  });

  const goToAssessment = () => {
    setScores({ sattva:0, rajas:0, tamas:0 });
    setCurrentQ(0);
    setView('assessment');
    setTab('checkin');
  };

  const handleClearAllData = () => {
    if (window.confirm('Erase all local sessions, feedback, and preferences from this device?')) {
      localStore.clearAll();
      setPreferences(DEFAULT_PREFERENCES);
      setScores({ sattva:0, rajas:0, tamas:0 });
      setAgentConsentToken(null);
      setView('onboarding');
      setTab('checkin');
      alert('All local Sanctuary data has been reset.');
    }
  };

  // Auto-save session to localStorage when results view loads
  useEffect(() => {
    if (view === 'results') {
      saveSession({
        name:      profile.name      || null,
        email:     profile.email     || null,
        age:       profile.age       || null,
        gender:    profile.gender    || null,
        mindStyle: profile.mindStyle || preferences.mindStyle || 'balanced',
        scores,
        hrv: bioData?.hrv || null,
      }).then(sid => { if (sid) setSessionId(sid); });
    }
  }, [view]);

  return (
    <AppShell
      currentTab={tab}
      onSelectTab={(selected) => {
        setTab(selected);
        if (selected === 'checkin' && view === 'feedback') {
          setView('results');
        }
      }}
      onOpenSupport={() => setShowGlobalSupport(true)}
      preferences={preferences}
      mcpStatus={mcpStatus}
    >
      {showGlobalSupport && (
        <DistressSupportModal
          onReturnAssessment={() => setShowGlobalSupport(false)}
          onContinueReflection={() => setShowGlobalSupport(false)}
        />
      )}

      {librarySession && (
        <GuidedSessionModal
          content={librarySession.protocol}
          stateName={librarySession.stateName}
          durationMinutes={preferences.sessionDuration || 3}
          speechRate={preferences.speechRate || 1.0}
          onTriggerAmbient={handleTriggerAmbient}
          onClose={() => setLibrarySession(null)}
        />
      )}

      {tab === 'checkin' && (
        <>
          {view === 'onboarding'  && <OnboardingView profile={profile} setProfile={setProfile} onEnter={goToAssessment} />}
          {view === 'assessment'  && <AssessmentView currentQ={currentQ} setCurrentQ={setCurrentQ} scores={scores} setScores={setScores} setView={setView} />}
          {view === 'processing'  && <ProcessingView setView={setView} />}
          {view === 'results'     && (
            <ResultsView
              scores={scores}
              profile={profile}
              preferences={preferences}
              bioData={bioData}
              setBioData={setBioData}
              setView={setView}
              onOpenGuidedSession={(proto, stName) => setLibrarySession({ protocol: proto, stateName: stName })}
              onTriggerAmbient={handleTriggerAmbient}
            />
          )}
          {view === 'feedback'    && <FeedbackView setView={setView} sessionId={sessionId} saveFeedback={saveFeedback} />}
        </>
      )}

      {tab === 'protocols' && (
        <ProtocolsView
          mcpStatus={mcpStatus}
          mcpPractices={mcpPractices}
          mcpLogs={mcpLogs}
          onRefreshMcp={connectToMcpServer}
          onStartSession={(proto, stName) => setLibrarySession({ protocol: proto, stateName: stName })}
        />
      )}

      {tab === 'home' && (
        <SmartHomeView
          mcpStatus={mcpStatus}
          mcpClient={mcpClientRef.current}
          preferences={preferences}
          onStartPractice={(proto, stName) => setLibrarySession({ protocol: proto, stateName: stName })}
          onTakeCheckin={goToAssessment}
        />
      )}

      {tab === 'history' && (
        <HistoryView
          onTakeCheckin={goToAssessment}
        />
      )}

      {tab === 'preferences' && (
        <PreferencesView
          preferences={preferences}
          setPreferences={setPreferences}
          onClearAllData={handleClearAllData}
          agentConsentToken={agentConsentToken}
          onToggleAgentConsent={handleToggleAgentConsent}
          onTestAgentAccess={handleTestAgentAccess}
        />
      )}
    </AppShell>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
