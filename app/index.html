<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Sanctuary of Mind — AI Mental Wellness</title>
  <meta name="description" content="India's first AI mental wellness platform combining Triguna psychology with HRV biometrics. Discover your inner state — Sattva, Rajas or Tamas — and receive personalized interventions." />
  <meta name="keywords" content="mental wellness, Triguna, Ayurveda, HRV, meditation, mindfulness, AI wellness, Sattva, Rajas, Tamas" />
  <meta property="og:title" content="Sanctuary of Mind — AI Mental Wellness" />
  <meta property="og:description" content="Ancient Indian psychology meets modern AI. Discover your Triguna state and receive personalized mental wellness guidance." />
  <meta property="og:url" content="https://sanctuaryofmind.netlify.app" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Sanctuary of Mind" />
  <meta name="twitter:description" content="Ancient Indian psychology meets modern AI. Triguna + HRV + personalized interventions." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --indigo: #5b5bd6;
      --indigo-light: #eef0ff;
      --indigo-mid: #c2c5f5;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-500: #64748b;
      --slate-300: #cbd5e1;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;
      --white: #ffffff;
      --green: #22c55e;
      --rose: #f43f5e;
      --amber: #f59e0b;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--slate-50);
      color: var(--slate-900);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    #root { width: 100%; min-height: 100vh; min-height: 100dvh; }

    /* ─── VIEWS ──────────────────────────────────── */
    .view {
      width: 100%; min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      animation: viewIn .45s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes viewIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── ONBOARDING ─────────────────────────────── */
    .ob-wrap {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: calc(var(--safe-top) + 2rem) 1.5rem calc(var(--safe-bottom) + 2rem);
      background: linear-gradient(160deg, #f0f2ff 0%, #fafafa 100%);
      gap: 1.5rem;
    }
    .ob-logo {
      width: 56px; height: 56px;
      background: white;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(91,91,214,.18);
      margin-bottom: .25rem;
    }
    .ob-logo svg { width: 26px; height: 26px; color: var(--indigo); }
    .ob-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2rem, 8vw, 2.5rem);
      font-weight: 300;
      color: var(--slate-900);
      letter-spacing: -.01em;
      text-align: center;
      line-height: 1.15;
    }
    .ob-sub {
      font-size: .9rem;
      color: var(--slate-500);
      text-align: center;
      font-weight: 300;
      margin-top: -.5rem;
    }
    .ob-card {
      width: 100%; max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 1.25rem;
      border: 1px solid #ececf8;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }
    .ob-label {
      font-size: .68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--slate-500);
      margin-bottom: .65rem;
      display: block;
    }
    .ob-btns {
      display: grid; gap: .45rem;
    }
    .ob-btns.cols3 { grid-template-columns: repeat(3,1fr); }
    .ob-btns.cols4 { grid-template-columns: repeat(4,1fr); }
    .ob-btn {
      padding: .65rem .4rem;
      border-radius: 10px;
      font-size: .8rem;
      font-weight: 500;
      border: none; cursor: pointer;
      transition: background .2s, color .2s, transform .12s;
      font-family: inherit;
    }
    .ob-btn:active { transform: scale(.95); }
    .ob-btn.off { background: var(--slate-100); color: var(--slate-700); }
    .ob-btn.on  { background: var(--indigo);   color: white; box-shadow: 0 3px 10px rgba(91,91,214,.3); }
    .ob-enter {
      width: 100%; max-width: 420px;
      padding: 1rem;
      background: var(--slate-900);
      color: white;
      border: none; border-radius: 14px;
      font-size: .95rem; font-weight: 500; font-family: inherit;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      box-shadow: 0 8px 24px rgba(15,23,42,.18);
      transition: transform .15s, box-shadow .15s;
      letter-spacing: .02em;
    }
    .ob-enter:active { transform: scale(.97); box-shadow: 0 4px 12px rgba(15,23,42,.15); }
    .ob-enter svg { width: 16px; height: 16px; }
    .ob-footer {
      display: flex; align-items: center; gap: .4rem;
      font-size: .65rem; color: var(--slate-300);
      text-transform: uppercase; letter-spacing: .08em;
    }
    .ob-footer svg { width: 11px; height: 11px; }

    /* ─── ASSESSMENT ─────────────────────────────── */
    .as-wrap {
      flex: 1;
      display: flex; flex-direction: column;
      padding: calc(var(--safe-top) + 1.5rem) 1.5rem calc(var(--safe-bottom) + 1.5rem);
      background: var(--slate-50);
      gap: 1.5rem;
    }
    .as-bar-track {
      height: 3px; background: #e2e8f0; border-radius: 99px; overflow: hidden;
    }
    .as-bar-fill {
      height: 100%; background: var(--indigo);
      border-radius: 99px;
      transition: width .6s cubic-bezier(.22,1,.36,1);
    }
    .as-meta {
      display: flex; justify-content: space-between;
      font-size: .7rem; color: var(--slate-500);
      font-weight: 500; text-transform: uppercase; letter-spacing: .06em;
    }
    .as-content {
      flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.75rem;
      animation: viewIn .5s cubic-bezier(.22,1,.36,1) both;
    }
    .as-q {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.5rem, 6.5vw, 2rem);
      font-weight: 300;
      color: var(--slate-900);
      line-height: 1.35;
    }
    .as-options { display: flex; flex-direction: column; gap: .75rem; }
    .as-opt {
      width: 100%;
      padding: 1.1rem 1.25rem;
      background: white;
      border-radius: 14px;
      border: none;
      text-align: left;
      cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      font-family: inherit;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      transition: box-shadow .2s, transform .12s, background .15s;
    }
    .as-opt:active { transform: scale(.98); background: var(--indigo-light); }
    .as-opt-text { font-size: .95rem; color: var(--slate-700); line-height: 1.4; }
    .as-opt-icon { width: 14px; height: 14px; color: var(--indigo-mid); flex-shrink: 0; margin-left: .75rem; }

    /* ─── PROCESSING ─────────────────────────────── */
    .proc-wrap {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #1a1740;
      padding: 2rem 1.5rem;
      text-align: center;
      position: relative; overflow: hidden;
    }
    .proc-glow {
      position: absolute; inset: 0;
      background: radial-gradient(circle at center, rgba(99,102,241,.35) 0%, transparent 70%);
      pointer-events: none;
    }
    .proc-content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 2rem;
      animation: procIn 1s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes procIn {
      from { opacity: 0; transform: scale(.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    .proc-icon { color: #a5b4fc; opacity: .8; animation: pulseOp 2s ease-in-out infinite; }
    .proc-icon svg { width: 44px; height: 44px; }
    @keyframes pulseOp { 0%,100%{opacity:.8} 50%{opacity:.4} }
    .proc-quote {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.2rem, 5.5vw, 1.65rem);
      color: #dde4ff;
      font-weight: 300;
      line-height: 1.6;
      max-width: 320px;
    }
    .proc-hl { color: white; border-bottom: 1px solid #6366f1; padding-bottom: 1px; }
    .proc-scan {
      width: 120px; height: 2px;
      background: linear-gradient(90deg, transparent, #6366f1, transparent);
      border-radius: 99px;
      animation: scanAnim 1.2s ease-in-out infinite;
    }
    @keyframes scanAnim {
      0%   { transform: scaleX(.2); opacity: .6; }
      50%  { transform: scaleX(1.4); opacity: 1; }
      100% { transform: scaleX(.2); opacity: .6; }
    }

    /* ─── RESULTS ────────────────────────────────── */
    .res-wrap {
      flex: 1; display: flex; flex-direction: column;
      background: radial-gradient(circle at 50% 0%, #f0f2ff 0%, #fafafa 60%);
      padding-bottom: calc(var(--safe-bottom) + 2rem);
    }
    .res-header {
      padding: calc(var(--safe-top) + 1rem) 1.5rem 1rem;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid #ececf8;
      position: sticky; top: 0; z-index: 10;
    }
    .res-status { display: flex; align-items: center; gap: .5rem; }
    .res-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(34,197,94,.5);
      animation: pulseOp 2s ease-in-out infinite;
    }
    .res-status-lbl {
      font-size: .68rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .07em;
      color: var(--slate-500);
    }
    .res-close-btn {
      border: none; background: none; cursor: pointer;
      color: var(--slate-500); padding: 6px;
      border-radius: 50%;
      transition: background .15s;
    }
    .res-close-btn:active { background: var(--slate-100); }
    .res-close-btn svg { width: 20px; height: 20px; display: block; }
    .res-main {
      padding: 1.5rem;
      display: flex; flex-direction: column; gap: 1.75rem;
      max-width: 520px; width: 100%; margin: 0 auto;
    }
    .res-resonance {
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: .85rem;
      animation: viewIn .5s .05s cubic-bezier(.22,1,.36,1) both;
    }
    .res-badge {
      padding: .45rem 1rem;
      background: var(--indigo-light);
      color: var(--indigo);
      font-size: .62rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em;
      border-radius: 99px;
    }
    .res-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.6rem, 7vw, 2.25rem);
      font-weight: 300; color: var(--slate-900);
    }
    .res-bio-btn {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: .72rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--indigo);
      background: white; border: 1.5px solid var(--indigo-mid);
      padding: .5rem 1rem; border-radius: 99px;
      cursor: pointer; font-family: inherit;
      transition: box-shadow .2s, transform .12s;
    }
    .res-bio-btn:active { transform: scale(.96); }
    .res-bio-btn svg { width: 14px; height: 14px; }
    .res-bio-ok {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: .72rem; font-weight: 600;
      color: #16a34a; background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      padding: .5rem 1rem; border-radius: 99px;
    }
    .res-bio-ok svg { width: 14px; height: 14px; }

    /* Circle */
    .res-circle-wrap {
      display: flex; justify-content: center;
      animation: viewIn .5s .12s cubic-bezier(.22,1,.36,1) both;
    }
    .circle-ctrl {
      position: relative;
      width: 220px; height: 220px;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
    }
    .circle-outer {
      position: absolute;
      width: 220px; height: 220px;
      border: 2px dashed #c7d2fe;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: scaleIn 1s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes scaleIn { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:scale(1)} }
    .circle-lbl-top {
      position: absolute; top: 8px;
      font-size: .6rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: var(--slate-500);
      background: #f7f8ff; padding: 0 6px;
    }
    .circle-lbl-bot {
      position: absolute; bottom: 8px;
      font-size: .6rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: var(--slate-500);
      background: #f7f8ff; padding: 0 6px;
    }
    .circle-inner {
      position: relative; z-index: 2;
      width: 116px; height: 116px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5b5bd6, #7c3aed);
      box-shadow: 0 16px 36px rgba(91,91,214,.28);
      display: flex; align-items: center; justify-content: center;
      color: white; text-align: center; padding: 1rem;
      animation: innerIn 1s .2s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes innerIn { from{opacity:0;transform:scale(.7)} to{opacity:1;transform:scale(1.08)} }
    .circle-inner-lbl { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
    .circle-divider { height: 1px; width: 28px; background: rgba(255,255,255,.4); margin: .3rem auto; }
    .circle-inner-sub { font-size: .58rem; opacity: .9; font-weight: 400; }
    .circle-ping {
      position: absolute;
      width: 116px; height: 116px;
      border-radius: 50%;
      background: #5b5bd6;
      opacity: .15;
      animation: pingAnim 2s cubic-bezier(0,0,.2,1) infinite;
    }
    @keyframes pingAnim { 0%{transform:scale(1);opacity:.2} 100%{transform:scale(2.2);opacity:0} }

    /* Protocol card */
    .res-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,.09);
      border: 1px solid #ececf8;
      animation: viewIn .5s .2s cubic-bezier(.22,1,.36,1) both;
    }
    .res-card-hd {
      background: var(--slate-900);
      padding: 1.5rem;
      color: white;
      position: relative; overflow: hidden;
    }
    .res-card-hd-glow {
      position: absolute; top: -40px; right: -40px;
      width: 120px; height: 120px;
      background: var(--indigo);
      border-radius: 50%;
      filter: blur(40px); opacity: .25;
      pointer-events: none;
    }
    .res-card-meta {
      display: flex; align-items: center; gap: .4rem;
      margin-bottom: .5rem; opacity: .8;
    }
    .res-card-meta svg { width: 14px; height: 14px; color: #fbbf24; }
    .res-card-meta-lbl { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
    .res-card-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.25rem, 5vw, 1.65rem);
      font-weight: 400; margin-bottom: .4rem;
    }
    .res-card-desc {
      font-size: .82rem; color: #94a3b8; line-height: 1.55; font-weight: 300;
    }
    .res-card-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .res-step { display: flex; gap: .9rem; align-items: flex-start; }
    .res-step-num {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--indigo-light); color: var(--indigo);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .8rem; flex-shrink: 0;
    }
    .res-step-body h4 { font-size: .82rem; font-weight: 600; color: var(--slate-900); margin-bottom: .2rem; }
    .res-step-body p { font-size: .82rem; color: var(--slate-500); line-height: 1.5; }
    .res-action {
      width: 100%;
      padding: .95rem;
      background: var(--indigo);
      color: white;
      border: none; border-radius: 12px;
      font-size: .9rem; font-weight: 500; font-family: inherit;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      box-shadow: 0 6px 20px rgba(91,91,214,.28);
      transition: transform .12s, box-shadow .15s;
      margin-top: .25rem;
    }
    .res-action:active { transform: scale(.97); box-shadow: 0 3px 10px rgba(91,91,214,.2); }
    .res-action svg { width: 16px; height: 16px; }

    /* ─── BIOMETRIC MODAL ────────────────────────── */
    .bio-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: flex-end; justify-content: center;
      background: rgba(15,23,42,.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0;
      animation: overlayIn .25s ease both;
    }
    @keyframes overlayIn { from{opacity:0} to{opacity:1} }
    .bio-sheet {
      width: 100%; max-width: 480px;
      background: white;
      border-radius: 24px 24px 0 0;
      overflow: hidden;
      padding-bottom: calc(var(--safe-bottom) + 1.5rem);
      animation: sheetUp .35s cubic-bezier(.22,1,.36,1) both;
      max-height: 90vh; overflow-y: auto;
    }
    @keyframes sheetUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .bio-handle {
      width: 40px; height: 4px;
      background: #e2e8f0; border-radius: 99px;
      margin: 12px auto 0;
    }
    .bio-close {
      position: absolute; top: 16px; right: 16px;
      border: none; background: none; cursor: pointer;
      color: var(--slate-500); padding: 4px;
    }
    .bio-close svg { width: 22px; height: 22px; }
    .bio-inner { padding: 1.5rem; text-align: center; }
    .bio-icon-wrap {
      width: 60px; height: 60px;
      background: var(--indigo-light); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto .75rem;
      color: var(--indigo);
    }
    .bio-icon-wrap svg { width: 28px; height: 28px; }
    .bio-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.5rem; font-weight: 400; color: var(--slate-900);
      margin-bottom: .3rem;
    }
    .bio-sub { font-size: .82rem; color: var(--slate-500); margin-bottom: 1.25rem; }
    .bio-methods { display: flex; flex-direction: column; gap: .6rem; text-align: left; }
    .bio-method {
      display: flex; align-items: center;
      padding: .9rem 1rem;
      border: 1.5px solid var(--slate-100);
      border-radius: 14px;
      cursor: pointer; background: white;
      font-family: inherit;
      transition: border-color .2s, background .15s, transform .12s;
    }
    .bio-method:active { transform: scale(.98); background: var(--indigo-light); border-color: var(--indigo-mid); }
    .bio-method-icon {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-right: .9rem; flex-shrink: 0;
    }
    .bio-method-icon svg { width: 18px; height: 18px; }
    .bio-method-icon.blue { background: #dbeafe; color: #2563eb; }
    .bio-method-icon.rose { background: #ffe4e6; color: #e11d48; }
    .bio-method-icon.gray { background: var(--slate-100); color: var(--slate-700); }
    .bio-method-lbl { font-size: .85rem; font-weight: 700; color: var(--slate-900); display: block; }
    .bio-method-sub { font-size: .72rem; color: var(--slate-500); display: block; }
    /* measuring */
    .bio-measuring { padding: 1rem 0; }
    .bio-meas-hint { font-size: .72rem; font-weight: 700; margin-bottom: .3rem; }
    .bio-meas-hint.rose { color: var(--rose); }
    .bio-meas-hint.blue { color: #2563eb; }
    .bio-meas-demo { font-size: .65rem; color: var(--slate-500); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 1rem; }
    .bio-circle-wrap {
      position: relative;
      width: 160px; height: 160px;
      margin: 0 auto 1.25rem;
      display: flex; align-items: center; justify-content: center;
    }
    .bio-circle-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .bio-circle-center {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
    }
    .bio-circle-center svg { width: 28px; height: 28px; color: var(--rose); }
    .bio-bpm { font-size: 2rem; font-weight: 300; color: var(--slate-900); }
    .bio-bpm-lbl { font-size: .6rem; font-weight: 700; color: var(--slate-400); text-transform: uppercase; }
    .bio-hrv { text-align: center; }

    /* ─── DESIGN SYSTEM TOKENS & ACCESSIBILITY ──── */
    :root {

      --slate-600: #475569;
      --slate-400: #94a3b8;
      --slate-200: #e2e8f0;
      --green-light: #dcfce7;
      --green-dark: #15803d;
      --rose-light: #ffe4e6;
      --rose-dark: #be123c;
      --amber-light: #fef3c7;
      --amber-dark: #b45309;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 30px rgba(0,0,0,0.12);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;

    :focus-visible {
      outline: 2.5px solid var(--indigo);

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    .reduced-motion *, .reduced-motion *::before, .reduced-motion *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;

    .high-contrast {
      --indigo: #3730a3;
      --indigo-light: #e0e7ff;

      --slate-700: #0f172a;
      --slate-50: #ffffff;
      --slate-100: #e2e8f0;

    /* ─── HISTORY VIEW ──────────────────────────── */

    .hist-clear-btn {

    .hist-card {

    /* ─── PREFERENCES VIEW ──────────────────────── */
    .pref-wrap {
      max-width: 680px; width: 100%; margin: 0 auto;
      padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 1.5rem;
    }
    .pref-title {
      font-family: var(--font-serif); font-size: clamp(1.8rem, 5vw, 2.2rem);
      font-weight: 400; color: var(--slate-900); text-align: center;
    }
    .pref-sub {
      font-size: 0.88rem; color: var(--slate-500); text-align: center; margin-top: -0.5rem;
    }
    .pref-card {
      background: white; border-radius: var(--radius-md);
      border: 1px solid var(--slate-200); padding: 1.25rem;

      box-shadow: var(--shadow-sm);
    }
    .pref-section-title {
      font-size: 0.82rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--slate-700); display: flex;
      align-items: center; gap: 0.4rem;

    .pref-btns-grid.cols3 { grid-template-columns: repeat(3, 1fr); }
    .pref-btns-grid.cols4 { grid-template-columns: repeat(4, 1fr); }
    .pref-btn-pill {
      padding: 0.65rem 0.5rem; border-radius: 10px; font-size: 0.8rem;
      font-weight: 500; border: 1.5px solid var(--slate-200);

      font-family: inherit; transition: all 0.15s ease; text-align: center;

    .pref-btn-pill.active {

      display: flex; align-items: center; justify-content: space-between;
      padding: 0.65rem 0; border-bottom: 1px solid var(--slate-100);
    }

      font-size: 0.85rem; font-weight: 600; color: var(--slate-900);
    }
    .pref-toggle-info p {
      font-size: 0.74rem; color: var(--slate-500); margin-top: 0.15rem;
    }
    .pref-checkbox-list {
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .pref-checkbox-item {
      display: flex; align-items: flex-start; gap: 0.65rem;
      padding: 0.65rem 0.85rem; border-radius: 10px;
      background: var(--slate-50); border: 1px solid var(--slate-200);
      cursor: pointer; transition: background 0.12s;
    }
    .pref-checkbox-item input[type="checkbox"] {
      margin-top: 0.2rem; cursor: pointer; accent-color: var(--indigo);
      width: 16px; height: 16px;
    }
    .pref-checkbox-title {
      font-size: 0.82rem; font-weight: 600; color: var(--slate-900); display: block;
    }
    .pref-checkbox-desc {
      font-size: 0.72rem; color: var(--slate-500); display: block; margin-top: 0.15rem;
    }
    .pref-actions {
      display: flex; flex-direction: column; gap: 0.65rem; margin-top: 0.5rem;
    }
    .pref-save-btn {
      width: 100%; padding: 0.95rem; border-radius: 12px;
      background: var(--indigo); color: white; border: none;
      font-size: 0.92rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      box-shadow: 0 4px 14px rgba(91,91,214,0.28); font-family: inherit;
    }
    .pref-reset-btn {
      width: 100%; padding: 0.75rem; border-radius: 12px;

    /* ─── RATIONALE CALLOUT & NON-DIAGNOSTIC NOTICE ── */
    .res-rationale-box {
      background: var(--indigo-light); border: 1px solid var(--indigo-mid);
      border-radius: 12px; padding: 0.85rem 1rem; margin-top: 1rem;

    .res-rationale-title {

      letter-spacing: 0.05em; color: var(--indigo); margin-bottom: 0.25rem;

      font-size: 0.8rem; color: var(--slate-700); line-height: 1.4;
    }
    .res-disclaimer-notice {
      background: var(--slate-100); border-radius: 10px;
      padding: 0.75rem 1rem; margin-top: 1rem; font-size: 0.72rem;

    }
    .res-alt-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
      padding: 0.65rem 1rem; border-radius: 10px;
      background: white; border: 1.5px solid var(--slate-300);
      color: var(--slate-700); font-size: 0.8rem; font-weight: 600;
      cursor: pointer; font-family: inherit; margin-top: 0.75rem; width: 100%;
    }
    .res-alt-btn:hover { background: var(--slate-50); border-color: var(--indigo); color: var(--indigo); }

    /* ─── VOICE EXPERIENCE & SIMULATION CONTROLS ── */
    .session-voice-panel {
      background: var(--slate-50); border: 1px solid var(--slate-200);
      border-radius: 12px; padding: 0.85rem; margin-top: 1rem; text-align: left;
    }
    .session-voice-hd {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--slate-600); margin-bottom: 0.5rem;
    }
    .session-voice-status {
      font-size: 0.68rem; font-weight: 600; color: var(--indigo);
      background: var(--indigo-light); padding: 2px 6px; border-radius: 4px;
    }
    .session-voice-btns {
      display: flex; gap: 0.5rem; align-items: center;
    }
    .session-voice-speak-btn {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.5rem 0.85rem; border-radius: 8px; font-size: 0.78rem;
      font-weight: 600; background: var(--indigo); color: white;
      border: none; cursor: pointer; font-family: inherit;
    }
    .session-voice-stop-btn {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.5rem 0.85rem; border-radius: 8px; font-size: 0.78rem;
      font-weight: 600; background: var(--slate-200); color: var(--slate-700);
      border: none; cursor: pointer; font-family: inherit;
    }

      margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.4rem;
    }
    .session-reflection-input-row {
      display: flex; gap: 0.4rem;
    }
    .session-reflection-inp {
      flex: 1; padding: 0.45rem 0.7rem; border: 1px solid var(--slate-300);
      border-radius: 8px; font-size: 0.78rem; font-family: inherit; outline: none;
    }
    .session-reflection-inp:focus { border-color: var(--indigo); }
    .session-reflection-send {
      padding: 0.45rem 0.75rem; border-radius: 8px; background: var(--slate-800);
      color: white; border: none; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .session-reflection-reply {
      background: white; border: 1px solid var(--indigo-mid);
      border-radius: 8px; padding: 0.6rem 0.75rem; font-size: 0.76rem;
      color: var(--slate-700); line-height: 1.4; animation: viewIn 0.2s ease both;
    }

    /* ─── TOAST BANNER ──────────────────────────── */
    .toast-banner {
      position: fixed; bottom: calc(var(--safe-bottom) + 5rem); left: 50%;
      transform: translateX(-50%); z-index: 100;
      background: var(--slate-900); color: white; font-size: 0.82rem;
      font-weight: 500; padding: 0.65rem 1.25rem; border-radius: var(--radius-full);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25); animation: toastIn 0.25s ease both;
      display: flex; align-items: center; gap: 0.5rem;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 15px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }


    
    /* ─── SANCTUARY HOME / SMART ENVIRONMENT STYLES ──── */
    .home-wrap {
      max-width: 1040px; margin: 0 auto; padding: 2rem 1.25rem 4rem;
      animation: viewIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .home-sim-notice {
      background: #fffbeb; color: #92400e; border: 1.5px solid #fde68a;
      border-radius: var(--radius-md); padding: 0.85rem 1.15rem;

      box-shadow: 0 1px 2px rgba(0,0,0,0.03);

      align-items: flex-start; justify-content: space-between; gap: 1rem;
    }

      font-weight: 600; color: var(--slate-900); margin: 0 0 0.35rem;
    }
    .home-hero-sub {
      font-size: 0.86rem; color: var(--slate-600); margin: 0; line-height: 1.5;
    }
    .home-mcp-status {
      display: inline-flex; align-items: center; gap: 0.45rem;
      padding: 0.35rem 0.8rem; border-radius: var(--radius-full);
      font-size: 0.72rem; font-weight: 700; background: white;
      border: 1px solid var(--slate-200); box-shadow: var(--shadow-sm);

    .home-mcp-status.live { color: #15803d; border-color: #86efac; background: #f0fdf4; }
    .home-mcp-status.fallback { color: #475569; border-color: var(--slate-200); background: var(--slate-50); }

    .home-scenes-hd {
      display: flex; align-items: center; justify-content: space-between;
      margin: 1.75rem 0 0.85rem;
    }
    .home-section-title {
      font-size: 1.05rem; font-weight: 700; color: var(--slate-900); margin: 0;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .home-scenes-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.25rem; margin-bottom: 1.75rem;
    }
    .scene-card {
      background: white; border-radius: var(--radius-md);

    .scene-title {
      font-size: 1.1rem; font-weight: 700; color: var(--slate-900); margin: 0;
    }
    .scene-desc {
      font-size: 0.8rem; color: var(--slate-600); margin: 0.4rem 0 0.9rem; line-height: 1.45;
    }
    .scene-targets-box {
      background: var(--slate-50); border: 1px solid var(--slate-200);

      border: none; transition: all 0.15s ease;

    .scene-btn-primary { background: var(--indigo); color: white; }

      font-size: 0.95rem; font-weight: 700; color: #1e3a8a; margin: 0;

    .home-active-sub {
      font-size: 0.76rem; color: #3b82f6; margin: 0.2rem 0 0;
    }
    .home-active-btns {
      display: flex; align-items: center; gap: 0.6rem;
    }

    .home-devices-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem; margin-bottom: 2rem;
    }
    .device-card {
      background: white; border: 1px solid var(--slate-200);
      border-radius: var(--radius-md); padding: 1.25rem;
      box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between;

    .device-pill-btn {

      font-size: 0.72rem; font-weight: 600; border: 1px solid var(--slate-200);

    .mcp-bar {
      background: white; border: 1px solid var(--slate-200);
      border-radius: var(--radius-md); padding: 0.85rem 1.15rem;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.75rem; box-shadow: var(--shadow-sm); margin-bottom: 1.25rem;

    }

    }

    .mcp-dot.offline { background: var(--slate-400); }
    .mcp-dot.connecting { background: var(--amber); animation: pulseOp 1s infinite; }
    .mcp-status-title {
      font-size: 0.82rem; font-weight: 700; color: var(--slate-900); display: block;
    }
    .mcp-status-endpoint {

    }

  append(key, item) {

  },
  remove(key) {

/* ─── BROWSER MCP STREAMABLE HTTP CLIENT ─────────── */
class BrowserMcpClient {
  constructor(endpoint = 'http://127.0.0.1:3333/mcp') {
    this.endpoint = endpoint;
    this.sessionId = null;
    this.protocolVersion = '2025-11-25';
    this.reqId = 1;
  }

  async sendJsonRpc(method, params = {}) {
    const id = this.reqId++;
    const headers = {
      'Content-Type': 'application/json',
      'Accept': 'application/json, text/event-stream'
    };
    if (this.sessionId) {
      headers['Mcp-Session-Id'] = this.sessionId;
    }
    if (method !== 'initialize') {
      headers['Mcp-Protocol-Version'] = this.protocolVersion;
    }

    const t0 = performance.now();
    const res = await fetch(this.endpoint, {
      method: 'POST',
      headers,
      body: JSON.stringify({
        jsonrpc: '2.0',
        id,
        method,
        params
      })
    });

    const latencyMs = Math.round(performance.now() - t0);

    const newSessionId = res.headers.get('mcp-session-id');
    if (newSessionId) {
      this.sessionId = newSessionId;
    }

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`HTTP ${res.status}: ${errText || res.statusText}`);
    }

    if (res.status === 202) {
      return { status: 202, latencyMs };
    }

    const contentType = res.headers.get('content-type') || '';
    if (contentType.includes('text/event-stream')) {
      const text = await res.text();
      const match = text.match(/data:\s*(.+)/);
      if (match) {
        return { data: JSON.parse(match[1]), latencyMs };
      }
      return { data: null, latencyMs };
    }

    const data = await res.json();
    return { data, latencyMs };
  }

  async connect() {
    const initRes = await this.sendJsonRpc('initialize', {
      protocolVersion: this.protocolVersion,
      capabilities: {},
      clientInfo: { name: 'sanctuary-web-client', version: '1.0.0' }
    });

    await this.sendJsonRpc('notifications/initialized');
    return initRes;
  }

  async listTools() {
    return this.sendJsonRpc('tools/list', {});
  }

  async callTool(name, args = {}) {
    return this.sendJsonRpc('tools/call', { name, arguments: args });
  }
}

/* ─── MATH ───────────────────────────────────────── */
function rmssd(arr = []) {
  if (arr.length < 2) return 0;
  let s = 0;
  for (let i = 1; i < arr.length; i++) { const d = arr[i] - arr[i-1]; s += d*d; }
  return Math.sqrt(s / (arr.length - 1));
}

/* ─── BIOMETRIC SHEET ────────────────────────────── */
function BiometricSheet({ onClose, onComplete }) {
  const [status, setStatus]   = useState('idle');
  const [method, setMethod]   = useState(null);
  const [bpm, setBpm]         = useState(0);
  const [hrv, setHrv]         = useState(0);
  const [progress, setProgress] = useState(0);
  const rrBuf      = useRef([]);
  const videoRef   = useRef(null);
  const canvasRef  = useRef(null);
  const rafId      = useRef(null);
  const btDevice   = useRef(null);
  const mounted    = useRef(true);
  const latestBpm  = useRef(0);

  useEffect(() => { mounted.current = true; return () => { mounted.current = false; cleanup(); }; }, []);

  const cleanup = () => {
    if (rafId.current) cancelAnimationFrame(rafId.current);
    if (videoRef.current?.srcObject) videoRef.current.srcObject.getTracks().forEach(t => t.stop());
    if (btDevice.current?.gatt?.connected) btDevice.current.gatt.disconnect();
  };

  const finish = (finalHrv, finalBpm) => {
    setStatus('success'); cleanup();
    setTimeout(() => { if (mounted.current) onComplete({ hrv: Math.round(finalHrv), bpm: finalBpm }); }, 1200);
  };

  const updateMetrics = useCallback((curBpm) => {
    const curHrv = rmssd(rrBuf.current);
    setHrv(Math.round(curHrv));
    setProgress(prev => {
      const next = prev + 0.6;
      if (next >= 100) { finish(curHrv, curBpm); return 100; }
      return next;
    });
  }, []);

  const startBluetooth = async () => {
    setMethod('bluetooth'); setStatus('scanning');
    try {
      const dev = await navigator.bluetooth.requestDevice({ filters:[{services:['heart_rate']}] });
      btDevice.current = dev;
      const srv  = await dev.gatt.connect();
      const svc  = await srv.getPrimaryService('heart_rate');
      const char = await svc.getCharacteristic('heart_rate_measurement');
      await char.startNotifications();
      char.addEventListener('characteristicvaluechanged', e => {
        if (!mounted.current) return;
        const v = e.target.value;
        const hr = (v.getUint8(0) & 1) ? v.getUint16(1,true) : v.getUint8(1);
        rrBuf.current.push(60000/hr);
        latestBpm.current = hr;
        setBpm(hr); updateMetrics(hr);
      });
      setStatus('measuring');
    } catch { setStatus('error'); }
  };

  const startCamera = async () => {
    setMethod('camera'); setStatus('scanning');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
        setStatus('measuring');
        analyzeFrame();
      }
    } catch { setStatus('error'); }
  };

  const analyzeFrame = () => {
    if (!canvasRef.current || !videoRef.current || !mounted.current) return;
    const ctx = canvasRef.current.getContext('2d');
    ctx.drawImage(videoRef.current, 0, 0, 100, 100);
    const d = ctx.getImageData(0,0,100,100).data;
    let r = 0; for (let i=0;i<d.length;i+=4) r+=d[i];
    if (r/(d.length/4) > 100) {
      const rr = 800 + Math.random()*50 - 25;
      rrBuf.current.push(rr);
      const cur = Math.floor(60000/rr);
      latestBpm.current = cur;
      setBpm(cur); updateMetrics(cur);
    }
    rafId.current = requestAnimationFrame(analyzeFrame);
  };

  const handleManual = e => {
    e.preventDefault();
    const b = parseInt(e.target.bpm.value, 10);
    const h = parseInt(e.target.hrv.value, 10) || 0;
    finish(h, b);
  };

  const circumference = 2 * Math.PI * 68;

  return (
    <div className="bio-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="bio-sheet" style={{position:'relative'}}>
        <div className="bio-handle" />
        <button className="bio-close" onClick={onClose} aria-label="Close sensor modal"><Icon d={icons.x} /></button>
        <div className="bio-inner">

          {status === 'idle' && <>
            <div className="bio-icon-wrap"><Icon d={icons.activity} size={28} /></div>
            <h2 className="bio-title">Physiological Resonance</h2>
            <p className="bio-sub">Select a sensor to tune the protocol to your body.</p>
            <div className="bio-methods">
              <button className="bio-method" onClick={startBluetooth}>
                <div className="bio-method-icon blue"><Icon d={icons.bluetooth} size={18} /></div>
                <div><span className="bio-method-lbl">Connect Device</span><span className="bio-method-sub">Polar, Whoop (Best Accuracy)</span></div>
              </button>
              <button className="bio-method" onClick={startCamera}>
                <div className="bio-method-icon rose"><Icon d={icons.camera} size={18} /></div>
                <div><span className="bio-method-lbl">Use Camera</span><span className="bio-method-sub">Simulated Estimation (Demo)</span></div>
              </button>
              <button className="bio-method" onClick={() => setStatus('manual_entry')}>
                <div className="bio-method-icon gray"><Icon d={icons.watch} size={18} /></div>
                <div><span className="bio-method-lbl">Manual Entry</span><span className="bio-method-sub">Apple Watch / Fitbit Data</span></div>
              </button>
            </div>
          </>}

          {(status === 'measuring' || status === 'scanning') && <>
            <div className="bio-measuring">
              {method === 'camera' && <p className="bio-meas-hint rose">Place finger gently over camera lens</p>}
              {method === 'camera' && <p className="bio-meas-demo">Simulated Estimation — Demo</p>}
              {method === 'bluetooth' && <p className="bio-meas-hint blue">Reading data stream...</p>}
              <div className="bio-circle-wrap">
                <svg viewBox="0 0 160 160">
                  <circle cx="80" cy="80" r="68" stroke="#e2e8f0" strokeWidth="5" fill="none" />
                  <circle cx="80" cy="80" r="68" stroke="#5b5bd6" strokeWidth="5" fill="none"
                    strokeDasharray={circumference}
                    strokeDashoffset={circumference * (1 - progress/100)}
                    style={{transition:'stroke-dashoffset .3s'}} />
                </svg>
                <div className="bio-circle-center">
                  <Icon d={icons.heart} size={26} style={{color:'var(--rose)', animation: bpm>0?'pulseOp 1.2s ease infinite':''}} />
                  <span className="bio-bpm">{bpm || '--'}</span>
                  <span className="bio-bpm-lbl">BPM</span>
                </div>
              </div>
              <div className="bio-hrv">
                <span className="bio-hrv-lbl">HRV (Resilience)</span>
                <span className="bio-hrv-val">{hrv > 0 ? hrv + ' ms' : 'Calculating...'}</span>
              </div>
              <video ref={videoRef} style={{display:'none'}} playsInline muted />
              <canvas ref={canvasRef} width="100" height="100" style={{display:'none'}} />
            </div>
          </>}

          {status === 'manual_entry' && <>
            <div className="bio-manual">
              <h3>Enter Device Data</h3>
              <form onSubmit={handleManual}>
                <div className="bio-form-group">
                  <label className="bio-form-lbl">Heart Rate (BPM)</label>
                  <input name="bpm" type="number" required placeholder="e.g. 72" className="bio-form-inp" />
                </div>
                <div className="bio-form-group">
                  <label className="bio-form-lbl">HRV (ms) — Optional</label>
                  <input name="hrv" type="number" placeholder="e.g. 45" className="bio-form-inp" />
                </div>
                <button type="submit" className="bio-submit">Save Data</button>
                <button type="button" className="bio-back" onClick={() => setStatus('idle')}>← Back</button>
              </form>
            </div>
          </>}

          {status === 'success' && <>
            <div className="bio-success">
              <div className="bio-success-icon"><Icon d={icons.check} size={36} /></div>
              <h3 className="bio-success-title">Resonance Captured</h3>
              <p className="bio-success-sub">Aligning protocol to your body...</p>
            </div>
          </>}

          {status === 'error' && <>
            <div className="bio-error">
              <div className="bio-error-icon"><Icon d={icons.alert} size={32} /></div>
              <p className="bio-error-text">Sensor unavailable or permission denied. You can continue with manual or simulated data.</p>
              <div style={{display:'flex', gap:'.5rem', justifyContent:'center'}}>
                <button className="bio-retry" onClick={() => setStatus('idle')}>Retry Sensor</button>
                <button className="bio-retry" style={{background:'var(--indigo)', color:'white'}} onClick={() => setStatus('manual_entry')}>Use Manual / Simulated Entry</button>
              </div>
            </div>
          </>}

        </div>
      </div>
    </div>
  );
}

/* ─── GUIDED SESSION MODAL (VOICE & AMBIENT SIM) ─── */
function GuidedSessionModal({ content, stateName, durationMinutes = 3, speechRate = 1.0, onTriggerAmbient, onClose }) {
  const initialSeconds = Math.max(durationMinutes * 60, 30);
  const [seconds, setSeconds] = useState(initialSeconds);
  const [isPaused, setIsPaused] = useState(false);
  const [isSpeaking, setIsSpeaking] = useState(false);
  const [speechSupported, setSpeechSupported] = useState(false);
  const [reflectionInput, setReflectionInput] = useState('');
  const [reflectionReply, setReflectionReply] = useState('');
  const [ambientSimFeedback, setAmbientSimFeedback] = useState(null);

  useEffect(() => {
    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      setSpeechSupported(true);
    }
  }, []);

  useEffect(() => {
    if (isPaused || seconds <= 0) return;
    const timer = setInterval(() => setSeconds(s => s - 1), 1000);
    return () => clearInterval(timer);
  }, [isPaused, seconds]);

  useEffect(() => {
    return () => {
      if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    };
  }, []);

  const toggleSpeech = () => {
    if (!speechSupported) return;
    if (isSpeaking) {
      window.speechSynthesis.cancel();
      setIsSpeaking(false);
    } else {
      window.speechSynthesis.cancel();
      const step1Text = content.step1 || (content.steps && content.steps[0]?.instruction) || '';
      const step2Text = content.step2 || (content.steps && content.steps[1]?.instruction) || '';
      const narrationText = `${content.title}. ${content.desc || content.description}. Step one: ${step1Text}. Step two: ${step2Text}.`;
      const utterance = new SpeechSynthesisUtterance(narrationText);
      utterance.rate = speechRate || 1.0;
      utterance.pitch = 1.0;
      utterance.onend = () => setIsSpeaking(false);
      utterance.onerror = () => setIsSpeaking(false);
      window.speechSynthesis.speak(utterance);
      setIsSpeaking(true);
    }
  };

  const handleReflectionSubmit = (e) => {
    e.preventDefault();
    if (!reflectionInput.trim()) return;
    const q = reflectionInput.toLowerCase();
    let reply = "Sanctuary Guide: Notice the feeling without judgment. Bring your gentle attention back to the rhythm of the inhale and exhale.";
    if (q.includes('distract') || q.includes('wander') || q.includes('thought')) {
      reply = "Sanctuary Guide: It is completely natural for thoughts to drift. Acknowledge the thought like a passing cloud, and softly anchor back to the breath.";
    } else if (q.includes('tense') || q.includes('tight') || q.includes('shoulder') || q.includes('pain')) {
      reply = "Sanctuary Guide: Invite a gentle softening in the jaw and shoulders. Exhale fully, letting gravity support your posture.";
    } else if (q.includes('restless') || q.includes('anxious') || q.includes('fast')) {
      reply = "Sanctuary Guide: Lengthen your exhale slightly. A calm, slow exhale signals safety to your nervous system.";
    }
    setReflectionReply(reply);
    setReflectionInput('');
  };

  const handleAmbientSim = async (actionType, setting) => {
    if (onTriggerAmbient) {
      const res = await onTriggerAmbient(actionType, setting);
      setAmbientSimFeedback(res);
    }
  };

  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;

            <button
              type="button"
              className="session-ambient-btn"
              onClick={() => handleAmbientSim('dim_lights', 'warm amber 2700K')}

            <button
              type="button"
              className="session-ambient-btn"
              onClick={() => handleAmbientSim('ambient_soundscape', 'gentle rain')}

              Play Rain Soundscape

            <button
              type="button"
              className="session-ambient-btn"
              onClick={() => handleAmbientSim('gentle_focus_cue', 'soft chime')}

              Emit Focus Chime
            </button>
          </div>
          {ambientSimFeedback && (
            <div className="session-ambient-feedback">
              <strong>{ambientSimFeedback.simulation_label || '[SIMULATION MODE]'}</strong>
              <div style={{marginTop:'.2rem'}}>{ambientSimFeedback.details?.effect || ambientSimFeedback.status}</div>
              <div style={{fontSize:'.68rem', color:'#a21caf', marginTop:'.2rem'}}>

            </div>

        {/* Voice Narration Panel */}
        <div className="session-voice-panel">
          <div className="session-voice-hd">
            <span>Voice &amp; Audio Pacing</span>
            <span className="session-voice-status">
              {speechSupported ? (isSpeaking ? 'Narrating...' : 'Ready') : 'Visual Only'}
            </span>
          </div>

          <div className="session-voice-btns">
            {speechSupported ? (
              <button
                type="button"
                className={isSpeaking ? "session-voice-stop-btn" : "session-voice-speak-btn"}
                onClick={toggleSpeech}
              >
                <Icon d={isSpeaking ? icons.volumeX : icons.volume} size={15} />
                <span>{isSpeaking ? 'Stop Voice' : 'Listen to Narration'}</span>
              </button>
            ) : (
              <span style={{fontSize: '0.74rem', color: 'var(--slate-500)'}}>
                Speech synthesis not supported in this browser.
              </span>
            )}
          </div>

          <div className="session-reflection-box">
            <form onSubmit={handleReflectionSubmit} className="session-reflection-input-row">
              <input
                type="text"
                className="session-reflection-inp"
                placeholder="Ask guide or share feeling (e.g. restless, mind wandering)..."
                value={reflectionInput}
                onChange={e => setReflectionInput(e.target.value)}
              />
              <button type="submit" className="session-reflection-send">
                Ask
              </button>
            </form>
            {reflectionReply && (
              <div className="session-reflection-reply">
                {reflectionReply}
              </div>
            )}
          </div>
        </div>

        <span className="sim-tag">
          Simulation Mode: Browser-guided pacing &amp; speech synthesis (No paid API or physical hardware required)
        </span>

        <div className="session-ctrls" style={{marginTop: '1.25rem'}}>
          <button
            type="button"
            className="session-btn-pause"
            onClick={() => setIsPaused(p => !p)}
          >
            {isPaused ? 'Resume' : 'Pause'}
          </button>
          <button
            type="button"
            className="session-btn-end"
            onClick={() => {
              if (speechSupported && window.speechSynthesis) window.speechSynthesis.cancel();
              onClose();
            }}
          >
            End Session & Return
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─── PRACTICES LIBRARY VIEW (WITH REAL MCP) ─────── */
function ProtocolsView({ mcpStatus, mcpPractices, mcpLogs, onRefreshMcp, onStartSession }) {
  const [gunaFilter, setGunaFilter] = useState('all');
  const [showLogs, setShowLogs] = useState(false);
  const [selectedDetail, setSelectedDetail] = useState(null);

  // Canonical fallback items if MCP is offline
  const localCanonicalItems = useMemo(() => {
    const list = [];
    ['sattva', 'rajas', 'tamas'].forEach(guna => {
      ['logical', 'emotional', 'spiritual'].forEach(style => {
        const p = LIBRARY[guna][style];
        list.push({
          id: p.id,
          guna,
          worldview: style,
          ...p,
          stateName: guna === 'sattva' ? 'Clear Energy (Sattva)' : guna === 'rajas' ? 'Active Energy (Rajas)' : 'Resting Energy (Tamas)',
          isMcpSource: false
        });
      });
    });
    return list;
  }, []);

  // Format MCP practices if available
  const items = useMemo(() => {
    if (mcpPractices && mcpPractices.length > 0) {
      return mcpPractices.map(p => ({
        ...p,
        step1: p.step1 || (LIBRARY[p.guna]?.[p.worldview]?.step1) || 'Observe the practice steps.',
        step2: p.step2 || (LIBRARY[p.guna]?.[p.worldview]?.step2) || 'Follow calming guidance.',

        isMcpSource: true
      }));
    }
    return localCanonicalItems;
  }, [mcpPractices, localCanonicalItems]);

  const filtered = items.filter(it => {
    if (gunaFilter !== 'all' && it.guna !== gunaFilter) return false;
    return true;
  });

  return (
    <div className="view">

            <div className="mcp-bar-left">
              <span className={`mcp-dot ${mcpStatus}`} />
              <div>
                <span className="mcp-status-title">
                  {mcpStatus === 'connected' ? '● MCP Server Connected (Live Streamable HTTP)' :
                   mcpStatus === 'connecting' ? 'Connecting to MCP Server...' :
                   '○ MCP Server Offline (Using Verified Local Fallback)'}
                </span>
                <span className="mcp-status-endpoint">http://127.0.0.1:3333/mcp (Protocol 2025-11-25)</span>
              </div>
            </div>
            <div className="mcp-bar-actions">
              <button type="button" className="mcp-btn mcp-btn-primary" onClick={onRefreshMcp}>
                <Icon d={icons.rotateCcw} size={14} />

              <button type="button" className="mcp-btn mcp-btn-secondary" onClick={() => setShowLogs(v => !v)}>

                {mcpLogs.length === 0 ? (

        fan: { power: true, speed: 'low', mode: 'quiet' },
        thermostat: { current_temp_f: 72, target_temp_f: 69, mode: 'cool', unit: '°F' }
      },
      recommended_practice: { id: 'sattva_logical', title: 'Maintenance of Clarity', guna: 'sattva', style: 'logical' }
    },

      id: 'sleep_prep',
      title: 'Sleep Preparation',
      tag: 'Circadian Wind-Down',
      badgeClass: 'sleep',
      desc: 'Deep dim sunset amber and slow waves to prepare circadian rhythm for rest.',
      targets: {
        lights: 'Sunset Amber 2200K · 12%',
        audio: 'Night Waves Pacing · 25%',
        fan: 'Whisper Low',
        thermostat: '68°F'
      },
      targetValues: {
        lights: { power: true, brightness: 12, color_temp_k: 2200, color_hex: '#e2725b', label: 'Deep Sunset Amber' },
        audio: { power: true, track: 'ocean', track_label: 'Night Waves Pacing', volume: 25 },
        fan: { power: true, speed: 'low', mode: 'whisper' },
        thermostat: { current_temp_f: 72, target_temp_f: 68, mode: 'night_cool', unit: '°F' }
      },
      recommended_practice: { id: 'tamas_emotional', title: 'Holding Space for Yourself', guna: 'tamas', style: 'emotional' }
    }
  ];

  // Local fallback simulation generator
  const simulateLocalScene = (sceneId) => {
    const scene = SCENES_DATA.find(s => s.id === sceneId);
    const targetLights = { ...scene.targetValues.lights };
    const targetAudio = { ...scene.targetValues.audio };
    const targetFan = { ...scene.targetValues.fan };
    const targetThermostat = { ...scene.targetValues.thermostat };

    const now = new Date();
    const action_timeline = [
      {
        timestamp: new Date(now.getTime() - 250).toLocaleTimeString(),
        source: 'user_action',
        title: 'User selected scene: "' + scene.title + '"',
        detail: 'Scene activation requested in Sanctuary Home interface.'
      },
      {
        timestamp: new Date(now.getTime() - 200).toLocaleTimeString(),
        source: 'mcp_tool_call',
        title: 'Local Fallback Simulation: simulate_wellness_scene executed',
        detail: 'Coordinating parameters for scene: ' + sceneId + ' (Verified local simulation).'
      },
      {
        timestamp: new Date(now.getTime() - 150).toLocaleTimeString(),
        source: 'simulated_hardware',
        title: 'Smart Lights: ' + targetLights.brightness + '% at ' + targetLights.color_temp_k + 'K',
        detail: '[SIMULATION] Virtual lighting smoothly transitioned to ' + targetLights.label + '.'
      },
      {
        timestamp: new Date(now.getTime() - 100).toLocaleTimeString(),
        source: 'simulated_hardware',
        title: 'Ambient Audio: ' + (targetAudio.power ? targetAudio.track_label : 'Muted') + ' (' + targetAudio.volume + '%)',
        detail: '[SIMULATION] Acoustic simulation configured to user preference.'
      },
      {
        timestamp: new Date(now.getTime() - 50).toLocaleTimeString(),
        source: 'simulated_hardware',
        title: 'Climate: Fan ' + targetFan.speed + ', Thermostat set to ' + targetThermostat.target_temp_f + '°F',
        detail: '[SIMULATION] Virtual ventilation and temperature setpoint adjusted.'
      },
      {
        timestamp: now.toLocaleTimeString(),
        source: 'wellness_ready',
        title: 'Scene Active — Recommended practice: "' + scene.recommended_practice.title + '"',
        detail: 'Guided wellness practice is ready to begin.'
      }
    ];

    return {
      status: 'SCENE_SIMULATED',
      scene_id: sceneId,
      scene_title: scene.title,
      simulation_label: '[SIMULATION - NO PHYSICAL HARDWARE CONNECTED]',
      simulation_notice: 'SIMULATION MODE — No physical smart-home devices are connected. All device states and environmental changes are simulated locally.',
      target_states: { lights: targetLights, audio: targetAudio, fan: targetFan, thermostat: targetThermostat },
      previous_states: deviceStates,
      recommended_practice: scene.recommended_practice,
      action_timeline,
      timestamp: now.toISOString()
    };
  };

  const handleActivateScene = async (sceneId) => {
    setSimulating(true);
    const scene = SCENES_DATA.find(s => s.id === sceneId);
    try {
      let result;
      if (mcpStatus === 'connected' && mcpClient) {
        const res = await mcpClient.callTool('simulate_wellness_scene', {
          scene_id: sceneId,
          current_states: deviceStates
        });
        result = JSON.parse(res.data.result.content[0].text);
      } else {
        result = simulateLocalScene(sceneId);
      }

      setPreviousStates(deviceStates);
      setDeviceStates(result.target_states);
      setActiveScene(sceneId);
      setActionTimeline(result.action_timeline);
      setRecommendedPractice(scene.recommended_practice);
      setMcpResponsePayload(result);
    } catch (err) {
      console.warn('MCP scene tool error, falling back locally:', err);
      const fallback = simulateLocalScene(sceneId);
      setPreviousStates(deviceStates);
      setDeviceStates(fallback.target_states);
      setActiveScene(sceneId);
      setActionTimeline(fallback.action_timeline);
      setRecommendedPractice(scene.recommended_practice);
      setMcpResponsePayload(fallback);
    } finally {
      setSimulating(false);
      setPreviewScene(null);
    }
  };

  const handleRestorePrevious = async () => {
    if (!previousStates) return;
    setSimulating(true);
    try {
      let result;
      if (mcpStatus === 'connected' && mcpClient) {
        const res = await mcpClient.callTool('restore_previous_scene', {
          previous_states: previousStates
        });
        result = JSON.parse(res.data.result.content[0].text);
      } else {
        const now = new Date();
        result = {
          status: 'RESTORED',
          simulation_label: '[SIMULATION - NO PHYSICAL HARDWARE CONNECTED]',
          restored_states: previousStates,
          action_timeline: [
            {
              timestamp: now.toLocaleTimeString(),
              source: 'user_action',
              title: 'User reverted scene to previous baseline',
              detail: 'Restored previous smart-home state via local fallback.'
            },
            {
              timestamp: now.toLocaleTimeString(),
              source: 'simulated_hardware',
              title: 'Simulated environment reverted successfully',
              detail: '[SIMULATION] Smart lights, acoustics, fan, and thermostat restored to previous values.'
            }
          ]
        };
      }
      setDeviceStates(previousStates);
      setActiveScene(null);
      setPreviousStates(null);
      setActionTimeline(prev => [...result.action_timeline, ...prev.slice(0, 10)]);
      setMcpResponsePayload(result);
    } catch (err) {
      setDeviceStates(previousStates);
      setActiveScene(null);
      setPreviousStates(null);
    } finally {
      setSimulating(false);
    }
  };

  const updateDevice = (deviceKey, updater) => {
    setDeviceStates(prev => {
      const nextDev = typeof updater === 'function' ? updater(prev[deviceKey]) : updater;
      const next = { ...prev, [deviceKey]: nextDev };
      const now = new Date();
      setActionTimeline(old => [
        {
          timestamp: now.toLocaleTimeString(),
          source: 'user_action',
          title: 'Manual control: ' + deviceKey.toUpperCase() + ' updated',
          detail: 'User adjusted ' + deviceKey + ' state directly in simulation interface.'
        },
        ...old.slice(0, 15)
      ]);
      return next;
    });
  };

  const kelvinToHex = (k) => {
    if (k <= 2500) return '#e2725b';
    if (k <= 3000) return '#ffb347';
    if (k <= 4200) return '#fdfbf7';
    if (k <= 5500) return '#eef6fc';
    return '#dbeafe';
  };

  const kelvinLabel = (k) => {
    if (k <= 2500) return 'Sunset Amber (' + k + 'K)';
    if (k <= 3200) return 'Warm Amber (' + k + 'K)';
    if (k <= 4500) return 'Daylight Neutral (' + k + 'K)';
    return 'Crisp Daylight (' + k + 'K)';
  };

  const activeSceneObj = SCENES_DATA.find(s => s.id === activeScene);

  return (
    <div className="view">
      <div className="home-wrap">
        {/* Persistent Simulation Notice */}
        <div className="home-sim-notice" role="alert">
          <Icon d={icons.lock} size={18} style={{ color: '#d97706', flexShrink: 0, marginTop: 1 }} />
          <div>
            <strong>SIMULATION MODE — No physical smart-home devices are connected.</strong> All device states and environmental changes are simulated locally.
          </div>
        </div>

        {/* Hero Header */}
        <div className="home-hero">
          <div>
            <h1 className="home-hero-title">Sanctuary Home · Smart Environment</h1>
            <p className="home-hero-sub">
              Experience how ambient lighting, acoustics, ventilation, and climate coordinate seamlessly to support your inner balance.
            </p>
          </div>
          <div>
            <span className={'home-mcp-status ' + (mcpStatus === 'connected' ? 'live' : 'fallback')}>
              <span className={'mcp-dot ' + mcpStatus} />
              <span>{mcpStatus === 'connected' ? 'Live MCP: simulate_wellness_scene' : 'Local Simulation Fallback'}</span>
            </span>
          </div>
        </div>

        {/* Active Scene Banner */}
        {activeScene && activeSceneObj && (
          <div className="home-active-banner">
            <div className="home-active-left">
              <span className="home-active-dot" />
              <div>
                <h3 className="home-active-title">Active Scene: {activeSceneObj.title}</h3>
                <p className="home-active-sub">
                  Simulated environment adjusted. {recommendedPractice ? 'Recommended: ' + recommendedPractice.title : ''}
                </p>
              </div>
            </div>
            <div className="home-active-btns">
              {recommendedPractice && (
                <button
                  type="button"
                  className="scene-btn scene-btn-primary"
                  onClick={() => onStartPractice(LIBRARY[recommendedPractice.guna][recommendedPractice.style], recommendedPractice.title)}
                >
                  <Icon d={icons.play} size={14} />
                  <span>Begin Guided Practice</span>
                </button>
              )}
              <button
                type="button"
                className="scene-btn scene-btn-secondary"
                onClick={handleRestorePrevious}

/* ─── HISTORY VIEW ───────────────────────────────── */
function HistoryView({ onTakeCheckin }) {
  const [sessions, setSessions] = useState(() => localStore.get(STORAGE_KEYS.SESSIONS, []));

  const handleDelete = (id) => {
    const updated = sessions.filter(s => s.id !== id);
    localStore.set(STORAGE_KEYS.SESSIONS, updated);
    setSessions(updated);
  };

  const handleClearAll = () => {
    if (window.confirm('Are you sure you want to clear your local session history?')) {
      localStore.set(STORAGE_KEYS.SESSIONS, []);
      setSessions([]);
    }
  };

  return (
    <div className="view">
      <div className="hist-wrap">
        <header className="hist-header">
          <div>
            <h1 className="hist-title">Session History</h1>
            <p style={{fontSize:'.82rem', color:'var(--slate-500)', marginTop:'.2rem'}}>
              Privately stored on this device ({sessions.length} recorded {sessions.length === 1 ? 'reflection' : 'reflections'})
            </p>
          </div>
          {sessions.length > 0 && (
            <button type="button" className="hist-clear-btn" onClick={handleClearAll}>
              Clear All
            </button>
          )}
        </header>

        {sessions.length === 0 ? (
          <div className="hist-empty">
            <Icon d={icons.history} size={36} style={{color:'var(--slate-300)'}} />
            <h3 style={{fontSize:'1.1rem', fontWeight:600, color:'var(--slate-700)'}}>No recorded sessions yet</h3>
            <p style={{fontSize:'.84rem', color:'var(--slate-500)', maxWidth:360}}>
              Your wellness check-ins will be securely saved locally on this device.
            </p>
            <button
              type="button"
              className="proto-card-btn"
              style={{width:'auto', padding:'.65rem 1.25rem', marginTop:'.5rem'}}
              onClick={onTakeCheckin}
            >
              Take a Check-in Now
            </button>
          </div>
        ) : (
          <div style={{display:'flex', flexDirection:'column', gap:'0.85rem'}}>
            {sessions.slice().reverse().map(s => {
              const dateStr = s.timestamp ? new Date(s.timestamp).toLocaleString([], { dateStyle:'medium', timeStyle:'short' }) : 'Earlier Session';
              return (
                <div key={s.id} className="hist-card">
                  <div className="hist-card-hd">
                    <span className="hist-date">{dateStr}</span>
                    <button
                      type="button"
                      className="hist-delete-btn"
                      onClick={() => handleDelete(s.id)}
                      title="Delete entry"
                      aria-label="Delete entry"
                    >
                      <Icon d={icons.trash} size={15} />
                    </button>
                  </div>
                  <div>
                    <span className={`proto-card-badge ${s.dominant_guna || 'sattva'}`}>
                      Dominant: {(s.dominant_guna || 'sattva').toUpperCase()}
                    </span>
                  </div>
                  <div className="hist-metrics">
                    <span className="hist-metric-pill">Sattva: {s.sattva_score ?? 0}</span>
                    <span className="hist-metric-pill">Rajas: {s.rajas_score ?? 0}</span>
                    <span className="hist-metric-pill">Tamas: {s.tamas_score ?? 0}</span>
                    {s.hrv && <span className="hist-metric-pill" style={{color:'var(--rose-dark)'}}>HRV: {s.hrv} ms</span>}
                    <span className="hist-metric-pill" style={{color:'var(--slate-400)', fontSize:'.68rem'}}>{s.mindstyle || 'balanced'}</span>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

    setForm(prev => {
      const list = prev.excludedTechniques || [];
      const next = list.includes(techId)
        ? list.filter(id => id !== techId)
        : [...list, techId];
      return { ...prev, excludedTechniques: next };
    });

    e?.preventDefault();

function ResultsView({ scores, profile, preferences, bioData, setBioData, setView, onOpenGuidedSession, onTriggerAmbient }) {
  const [showBio, setShowBio] = useState(false);
  const isDistress = scores.tamas >= 3 || (scores.tamas >= 2 && scores.rajas >= 2);
  const [showDistressModal, setShowDistressModal] = useState(isDistress);
  const [activeSession, setActiveSession] = useState(false);
  const [altIndex, setAltIndex] = useState(0);

  const dominant = (() => {
    const sv = (scores.sattva/4)*100;
    const rv = (scores.rajas/4)*100;
    const tv = (scores.tamas/4)*100;
    const bio = bioData ? Math.min(Math.max((bioData.hrv/100)*100, 0), 100) : 50;
    const wSv = (sv*.7) + (bioData ? bio*.3 : 0);
    const buf = bioData ? (1 - bio/200) : 1;
    const wRv = rv*.7*buf, wTv = tv*.7*buf;
    if (wRv > wSv && wRv > wTv) return 'rajas';
    if (wTv > wSv && wTv > wRv) return 'tamas';
    return 'sattva';
  })();

  const mindKey = profile.mindStyle === 'emotional' ? 'emotional'
    : (profile.beliefLevel === 'strong' || profile.spiritualStrength === 'strong') ? 'spiritual'
    : 'logical';

  const availableStyles = ['logical', 'emotional', 'spiritual'];
  const activeStyle = availableStyles[altIndex % 3];
  const baseContent = LIBRARY[dominant][activeStyle];

  const excluded = preferences?.excludedTechniques || [];
  let finalContent = { ...baseContent };
  let isAdapted = false;
  let adaptationReason = '';

  if (ADAPTED_PROTOCOLS[dominant]?.[activeStyle]) {

  const stateName = dominant === 'rajas' ? 'Active Energy (Rajas)'
    : dominant === 'tamas' ? 'Resting Energy (Tamas)' : 'Clear Energy (Sattva)';

  return (
    <div className="view">
      {showBio && <BiometricSheet onClose={() => setShowBio(false)} onComplete={d => { setBioData(d); setShowBio(false); }} />}
      {showDistressModal && (
        <DistressSupportModal
          onReturnAssessment={() => setView('onboarding')}
          onContinueReflection={() => setShowDistressModal(false)}
        />
      )}
      {activeSession && (
        <GuidedSessionModal
          content={finalContent}
          stateName={stateName}
          durationMinutes={preferences?.sessionDuration || 3}
          speechRate={preferences?.speechRate || 1.0}
          onTriggerAmbient={onTriggerAmbient}

function FeedbackView({ setView, sessionId, saveFeedback }) {
  const [name, setName]         = useState('');
  const [email, setEmail]       = useState('');
  const [rating, setRating]     = useState(0);
  const [hover, setHover]       = useState(0);
  const [feedback, setFeedback] = useState('');
  const [consentShare, setConsentShare] = useState(false);
  const [errors, setErrors]     = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted]   = useState(false);

  const validate = () => {
    const e = {};
    if (!name.trim()) e.name = 'Name is required';
    if (!email.trim()) e.email = 'Email is required';
    else if (!/^[^s@]+@[^s@]+.[^s@]+$/.test(email)) e.email = 'Enter a valid email';
    if (!rating) e.rating = 'Please select a rating';
    if (!feedback.trim()) e.feedback = 'Feedback is required';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!validate()) return;
    setSubmitting(true);
    try {
      await saveFeedback({
        name: name.trim(),
        email: email.trim(),
        rating,
        feedback: feedback.trim(),
        sessionId,
        consentShare,
      });
      setSubmitted(true);
    } catch (err) {
      console.warn('Feedback submit failed:', err);
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div className="view">
      <div className="fb-wrap">
        <header className="fb-header">
          <span className="fb-header-title">Feedback</span>
          <button className="res-close-btn" aria-label="Close Feedback" onClick={() => setView('results')}>
            <Icon d={icons.x} size={20} />
          </button>
        </header>
        <main className="fb-main">
          {submitted ? (
            <div className="fb-success">
              <div className="fb-success-icon"><Icon d={icons.check} size={36} /></div>
              <h2 className="fb-success-title">Thank you!</h2>
              <p className="fb-success-sub">
                {consentShare
                  ? 'Your feedback has been saved locally and transmitted anonymously with your consent.'
                  : 'Your feedback has been saved privately on this device (local storage).'}
              </p>
              <button className="fb-back" onClick={() => setView('results')}>Back to Results</button>
            </div>
          ) : (
            <>
              <h1 className="fb-heading">Share Your Experience</h1>
              <p className="fb-sub">Help us improve Sanctuary with your feedback.</p>
              <form onSubmit={handleSubmit}>
                <div className="fb-card">
                  <div className="fb-group">
                    <label className="fb-label">Name</label>
                    <input className="fb-input" type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Your name" />
                    {errors.name && <span className="fb-error">{errors.name}</span>}
                  </div>
                  <div className="fb-group">
                    <label className="fb-label">Email</label>
                    <input className="fb-input" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@example.com" />
                    {errors.email && <span className="fb-error">{errors.email}</span>}
                  </div>
                  <div className="fb-group">
                    <label className="fb-label">Rating</label>
                    <div className="fb-stars">
                      {[1,2,3,4,5].map(s => (
                        <button type="button" key={s} className="fb-star"
                          onMouseEnter={() => setHover(s)}
                          onMouseLeave={() => setHover(0)}
                          onClick={() => setRating(s)}>
                          <svg width="28" height="28" viewBox="0 0 24 24"
                            fill={s <= (hover || rating) ? '#5b5bd6' : 'none'}
                            stroke={s <= (hover || rating) ? '#5b5bd6' : '#cbd5e1'}
                            strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <path d={icons.star} />
                          </svg>
                        </button>
                      ))}
                    </div>
                    {errors.rating && <span className="fb-error">{errors.rating}</span>}
                  </div>
                  <div className="fb-group">
                    <label className="fb-label">Feedback</label>
                    <textarea className="fb-textarea" value={feedback} onChange={e => setFeedback(e.target.value)} placeholder="Tell us about your experience..." />
                    {errors.feedback && <span className="fb-error">{errors.feedback}</span>}
                  </div>
                  <label className="fb-consent-label">
                    <input
                      type="checkbox"
                      checked={consentShare}
                      onChange={e => setConsentShare(e.target.checked)}
                    />
                    <span>Opt-in: Share anonymous feedback to help researchers improve this sanctuary (Default is private to this device)</span>
                  </label>
                  <button type="submit" className="fb-submit" disabled={submitting}>
                    <Icon d={icons.send} size={16} />
                    <span>{submitting ? 'Saving...' : 'Submit Feedback'}</span>
                  </button>
                </div>
              </form>
            </>
          )}
        </main>
      </div>
    </div>
  );
}
